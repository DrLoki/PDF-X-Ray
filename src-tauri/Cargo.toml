[package]
name = "pdf-xray"
version = "0.2.0"
description = "PDF X-Ray — Structure & Layout Analyzer"
authors = ["Giampaolo Bolzonella <giampaolo.bolzonella@gmail.com>"]
edition = "2021"
default-run = "pdf-xray"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pdf_xray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The headless analyzer is a developer tool: it is built only with
# `--features cli`, so the Tauri bundler leaves it out of the app packages.
[[bin]]
name = "cli_analyze"
path = "src/bin/cli_analyze.rs"
required-features = ["cli"]

[features]
cli = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

