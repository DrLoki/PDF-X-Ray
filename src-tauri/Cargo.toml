[package]
name = "pdf-xray"
version = "0.2.0"
description = "PDF X-Ray — Structure & Layout Analyzer"
authors = ["Giampaolo Bolzonella <giampaolo.bolzonella@gmail.com>"]
edition = "2021"
default-run = "pdf-xray"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pdf_xray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The headless analyzer (`cargo build --example cli_analyze`) lives in
# examples/: as a binary target the Tauri bundler would ship it in the app
# packages, and the universal macOS build has no copy of it.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rten = "0.28"
rten-tensor = "0.28"
sha2 = "0.11.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
ureq = "3.5.2"


# The OCR runtime (rten) and the image resizing are unusably slow without
# optimisation: build the dependencies optimised in dev and test builds too.
[profile.dev.package."*"]
opt-level = 3

# The OCR pre/post-processing (pixel loops) lives in this crate.
[profile.dev.package.pdf-xray]
opt-level = 1
